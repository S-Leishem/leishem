<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Support Soubam Leishem with a voluntary UPI donation to help fund future projects and learning."
    />
    <title>Support My Work | Soubam Leishem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      body {
        min-height: 100vh;
      }

      .donate-shell {
        padding: 4rem 0 5rem;
      }

      .donate-card {
        max-width: 820px;
        margin: 0 auto;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        padding: clamp(1.5rem, 3vw, 2.5rem);
        box-shadow: 0 18px 40px rgba(2, 6, 23, 0.2);
      }

      .donate-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .donate-header h1 {
        margin: 0 0 0.8rem;
        font-size: clamp(2.1rem, 5vw, 3.1rem);
        line-height: 1.1;
      }

      .donate-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2rem;
        align-items: center;
      }

      .donate-text {
        color: var(--muted);
      }

      .upi-box {
        background: rgba(10, 15, 25, 0.7);
        border: 1px solid var(--border);
        border-radius: 1rem;
        padding: 1rem;
      }

      .upi-box p {
        margin: 0.3rem 0;
      }

      .upi-id {
        font-size: 1.05rem;
        color: var(--text);
        word-break: break-word;
      }

      .qr-block {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        gap: 1rem;
      }

      .qr-placeholder {
        width: min(100%, 290px);
        min-height: 290px;
        border: 1px solid var(--border);
        border-radius: 1rem;
        background: rgba(17, 24, 39, 0.8);
        padding: 1rem;
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
      }

      .qr-placeholder::before {
        content: "";
        position: absolute;
        inset: 14px;
        background-image:
          linear-gradient(to right, rgba(99, 102, 241, 0.18) 10%, transparent 10%, transparent 20%, rgba(99, 102, 241, 0.18) 20%, rgba(99, 102, 241, 0.18) 30%, transparent 30%, transparent 40%, rgba(99, 102, 241, 0.18) 40%, rgba(99, 102, 241, 0.18) 50%, transparent 50%, transparent 60%, rgba(99, 102, 241, 0.18) 60%, rgba(99, 102, 241, 0.18) 70%, transparent 70%, transparent 80%, rgba(99, 102, 241, 0.18) 80%, rgba(99, 102, 241, 0.18) 90%, transparent 90%),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.18) 10%, transparent 10%, transparent 20%, rgba(99, 102, 241, 0.18) 20%, rgba(99, 102, 241, 0.18) 30%, transparent 30%, transparent 40%, rgba(99, 102, 241, 0.18) 40%, rgba(99, 102, 241, 0.18) 50%, transparent 50%, transparent 60%, rgba(99, 102, 241, 0.18) 60%, rgba(99, 102, 241, 0.18) 70%, transparent 70%, transparent 80%, rgba(99, 102, 241, 0.18) 80%, rgba(99, 102, 241, 0.18) 90%, transparent 90%);
        background-size: 100% 100%;
        border: 1px solid rgba(99, 102, 241, 0.35);
        border-radius: 0.8rem;
      }

      .qr-placeholder span {
        position: relative;
        z-index: 1;
        font-size: 1.2rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        font-weight: 700;
      }

      .upi-button {
        margin-top: 1rem;
      }

      .back-link {
        display: inline-block;
        margin-top: 1.75rem;
        color: var(--accent);
        font-weight: 600;
      }

      @media (max-width: 720px) {
        .donate-content {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="donate-shell">
      <div class="container">
        <div class="donate-card">
          <div class="donate-header">
            <p class="eyebrow">Support</p>
            <h1>Support My Work</h1>
          </div>

          <div class="donate-content">
            <div class="donate-text">
              <p>
                Donations are optional and help support future projects, learning, and website work.
                Your support is truly appreciated.
              </p>

              <div class="upi-box">
                <p><strong>UPI ID</strong></p>
                <p class="upi-id">soubam3@ptyes</p>
              </div>

              <a class="button primary upi-button" href="upi://pay?pa=soubam3%40ptyes&pn=Soubam%20Leishem&cu=INR">Pay with UPI</a>
            </div>

            <div class="qr-block">
              <div class="qr-placeholder" aria-label="UPI QR code">
                <img src="assets/images/qr.jpeg" alt="UPI QR code for soubam3@ptyes" />
              </div>
              <p class="donate-text">
                Scan the QR or use the UPI ID above to donate.
              </p>
            </div>
          </div>

          <a class="back-link" href="index.html">← Back to Portfolio</a>
        </div>
      </div>
    </main>
  </body>
</html>
